<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Innself — KYC verification</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  </head>
  <body>
    <div id="loading"><div class="spinner"></div></div>
    <div id="toast"></div>
    <main class="page">
      <header class="topbar"><button class="back-btn" onclick="go('/admin/dashboard.html')"><i class="ti ti-arrow-left"></i></button><span class="topbar-title">KYC verification</span><button class="back-btn" onclick="refresh()"><i class="ti ti-refresh"></i></button></header>
      <section id="content" style="padding:16px 12px"></section>
    </main>
    <script type="module">
      import { requireAuth, getKYCQueue, reviewKYC, toast, loading } from '../supabase.js'
      const safe = value => String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]))
      window.go = url => { location.href = url }

      async function render() {
        const queue = await getKYCQueue()
        document.getElementById('content').innerHTML = queue.length ? queue.map(item => {
          const id = item.technician_id || item.id
          return `<article class="card"><div class="row-between"><div><h2>${safe(item.name || 'Technician')}</h2><p>${safe(item.email || '')}</p></div><span class="badge badge-amber">${safe(item.status || 'pending')}</span></div>${item.kyc_doc_url ? `<a href="${safe(item.kyc_doc_url)}" target="_blank" rel="noopener" class="btn btn-secondary" style="margin-top:14px">View submitted document</a>` : '<p style="margin-top:12px">No document URL supplied.</p>'}<div class="btn-row" style="margin-top:10px"><button class="btn btn-primary" onclick="decide('${id}','approved')">Approve</button><button class="btn btn-danger" onclick="decide('${id}','rejected')">Reject</button></div></article>`
        }).join('') : '<div class="card" style="text-align:center"><i class="ti ti-circle-check" style="font-size:30px;color:var(--teal)"></i><h2 style="margin-top:8px">KYC queue is clear</h2><p>There are no pending technician verifications.</p></div>'
      }

      window.decide = async (techId, decision) => {
        const reason = decision === 'rejected' ? prompt('Why is this KYC being rejected?') : ''
        if (decision === 'rejected' && !reason?.trim()) return
        loading(true)
        try { await reviewKYC(techId, decision, reason); toast(`KYC ${decision}.`, 'success'); await render() } catch (error) { toast(error.message, 'error') }
        loading(false)
      }
      window.refresh = async () => { loading(true); try { await render() } catch (error) { toast(error.message, 'error') }; loading(false) }
      ;(async () => { if (!await requireAuth(['admin'])) return; await refresh() })()
    </script>
  </body>
</html>
